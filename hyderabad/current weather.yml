info:
  name: "current weather "
  type: http
  seq: 1

http:
  method: GET
  url: https://api.open-meteo.com/v1/forecast?latitude=17.3850&longitude=78.4867&current_weather=true
  params:
    - name: latitude
      value: "17.3850"
      type: query
    - name: longitude
      value: "78.4867"
      type: query
    - name: current_weather
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
